# Place this file at: .github/workflows/snake.yml  (in the Shridhar600/Shridhar600 repo)
# It regenerates the contribution-snake SVGs daily and pushes them to the `output` branch,
# which the README references via raw.githubusercontent.com.
name: generate contribution snake

permissions:
  contents: write              # needed to push the generated SVGs to the output branch

on:
  schedule:
    - cron: "0 */24 * * *"   # once a day
  workflow_dispatch:          # lets you run it manually the first time
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
